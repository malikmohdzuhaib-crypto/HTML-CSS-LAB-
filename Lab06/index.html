<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Types of HTML Lists</h1>

    <div class="box">
        <h2>1. Ordered List</h2>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>

        <h2>2. Unordered List</h2>
        <ul>
            <li>Apple</li>
            <li>Mango</li>
            <li>Orange</li>
        </ul>

        <h2>3. Description List</h2>
        <dl>
            <dt>HTML</dt>
            <dd>Used to create webpage structure.</dd>

            <dt>CSS</dt>
            <dd>Used to style webpages.</dd>
        </dl>
    </div>
</body>
</html>
